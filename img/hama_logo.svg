<svg class="logo" viewBox="0 0 64 64" role="img" aria-label="HAMA ロゴ" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hl-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/><stop offset=".45" stop-color="#e2b84d"/><stop offset="1" stop-color="#9c6b14"/>
    </linearGradient>
  </defs>
  <!-- 六角形のエンブレム -->
  <polygon points="32,3 57,17.5 57,46.5 32,61 7,46.5 7,17.5" fill="#0d0f14" stroke="url(#hl-g)" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="32,9 52,20.5 52,43.5 32,55 12,43.5 12,20.5" fill="none" stroke="#d9b54a" stroke-opacity=".25" stroke-width="1"/>
  <!-- H の縦棒（インゴットのような金の柱） -->
  <rect x="19" y="18" width="6.5" height="28" rx="1.5" fill="url(#hl-g)"/>
  <rect x="38.5" y="18" width="6.5" height="28" rx="1.5" fill="url(#hl-g)"/>
  <!-- H の横棒 = 上向きのトレンドライン -->
  <polyline points="17,38 25,33 31,35.5 40,27 47,23" fill="none" stroke="#fff6cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="49.5,21 42.5,21.8 46.8,27.2" fill="#fff6cf"/>
</svg>
